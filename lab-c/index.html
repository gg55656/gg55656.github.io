<!--Małe zmiany do id i class przez GPT 6.1 Terra-->
<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gracjan Grzeszczak (55656) - AI LAB C</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link rel="stylesheet" href="style.css" type="text/css">
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
    defer
  ></script>
  <script src="scripts.js" defer></script>
</head>
<body>
<main class="page">
  <header class="page-header">
    <h1>Mapa puzzle 4x4</h1>
  </header>

  <div class="workspace-layout">
    <aside class="map-tools">
      <div class="panel-actions">
        <button class="button button--primary" id="location-button" type="button">Moja lokalizacja</button>
        <button class="button button--accent" id="download-button" type="button" disabled>Pobierz mapę</button>
      </div>
    </aside>

    <div class="workspace-grid">
      <article class="panel panel--map">
        <div id="map"></div>
      </article>

      <article class="panel">
        <canvas id="map-canvas" width="640" height="360"></canvas>
      </article>

      <article class="panel">
        <div id="pieces-tray"></div>
      </article>

      <article class="panel">
        <div id="puzzle-board"></div>
      </article>
    </div>
  </div>
</main>
</body>
</html>
