<!--Małe zmiany do id i class przez GPT 6.1 Terra-->
<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gracjan Grzeszczak (55656) - AI LAB D</title>

    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>
<main class="weather-app">
    <header class="page-header">
        <p class="page-label">Twoja prognoza</p>
        <h1>Sprawdź pogodę</h1>
        <p>Wpisz miejscowość, aby zobaczyć aktualną pogodę i prognozę.</p>
    </header>

    <div class="weather-layout">
    <div class="weather-sidebar">
    <form id="search-form" class="search-form">
        <label for="city-input">Miejscowość</label>
        <div class="search-row">
            <input id="city-input" type="text" placeholder="Np. Szczecin" required>
            <button type="submit">Pogoda</button>
        </div>
    </form>

    <section class="current-weather" id="current-weather">
        <h2>Aktualna pogoda</h2>
        <p>Wyszukaj miejscowość, aby zobaczyć pogodę.</p>
    </section>
    </div>

    <section class="forecast" id="forecast">
        <h2>Prognoza na 5 dni</h2>
        <p>Tutaj pojawi się prognoza dla wybranej miejscowości.</p>
    </section>
    </div>
</main>
</body>
</html>
